# OpenBook P&L subgraph — Task 4.
# Network: arc-testnet (Arc chain id 5042002). Consumes ERC-8183 commerce events
# and PolicyWallet withdrawal/policy events; produces the P&L freshness ledger.
# NOTE: the trading currency is native USDC (6 decimals); all amounts are BigInt
# raw units. We deliberately do NOT index USDC Transfer events (EIP-7708
# double-count trap) — dollar figures are carried by the semantic events below.
specVersion: 1.2.0
description: "OpenBook P&L — ERC-8183 commerce + PolicyWallet economics on Arc Testnet"
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  # ---- ERC-8183 open-commerce reference (already deployed on Arc testnet) ----
  - kind: ethereum/contract
    name: ERC8183
    network: arc-testnet
    source:
      # ERC-8183 open-commerce reference contract on Arc testnet
      # (verified in Task 0: proxy 0x0747…4583 -> impl 0xa316fd…351a)
      address: "0x0747EEf0706327138c69792bF28Cd525089e4583"
      abi: ERC8183
      # First OpenBook-relevant event verified onchain at block 61,314,527
      # (reject tx 0x5d89e616…); 527 blocks of buffer. Without this the node
      # syncs from genesis — ~61M blocks — and the ledger reads empty for days.
      startBlock: 61314000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - QueryPaid
        - Fulfilled
        - Settled
        - RefundIssued
        - DailyPnL
        - Provider
        - MarketDay
        - JobMeta
      abis:
        - name: ERC8183
          file: ./abis/erc8183.json
      eventHandlers:
        - event: JobCreated(indexed uint256,indexed address,indexed address,address,uint256,address)
          handler: handleJobCreated
        - event: JobFunded(indexed uint256,indexed address,uint256)
          handler: handleQueryPaid
        - event: JobSubmitted(indexed uint256,indexed address,bytes32)
          handler: handleFulfilled
        - event: PaymentReleased(indexed uint256,indexed address,uint256)
          handler: handleSettled
        - event: Refunded(indexed uint256,indexed address,uint256)
          handler: handleRefund
      file: ./src/mapping.ts
  # ---- OpenBook escrow instance (living-protocol T14) — same ERC-8183
  # events, same mapping; the market aggregates (Provider/MarketDay) and the
  # seller-scoped ledger both span the two dataSources. Instance proxy
  # deployed block 61,613,513 (admin role grants); first job = jobId 1 at
  # 61,613,629 (client 0xac54…54De, provider = operator). startBlock = first
  # job block − 500 per the T14 rule, covering the whole lifecycle (created /
  # funded / submitted / released / refunded).
  - kind: ethereum/contract
    name: ERC8183OpenBook
    network: arc-testnet
    source:
      address: "0x967e005154D0F62C33Eac8E2F44b44d4C4C07Dd5"
      abi: ERC8183
      startBlock: 61613129
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - QueryPaid
        - Fulfilled
        - Settled
        - RefundIssued
        - DailyPnL
        - Provider
        - MarketDay
        - JobMeta
      abis:
        - name: ERC8183
          file: ./abis/erc8183.json
      eventHandlers:
        - event: JobCreated(indexed uint256,indexed address,indexed address,address,uint256,address)
          handler: handleJobCreated
        - event: JobFunded(indexed uint256,indexed address,uint256)
          handler: handleQueryPaid
        - event: JobSubmitted(indexed uint256,indexed address,bytes32)
          handler: handleFulfilled
        - event: PaymentReleased(indexed uint256,indexed address,uint256)
          handler: handleSettled
        - event: Refunded(indexed uint256,indexed address,uint256)
          handler: handleRefund
      file: ./src/mapping.ts
  # ---- PolicyWallet (Task 2) — withdrawn costs + policy blocks ----
  - kind: ethereum/contract
    name: PolicyWallet
    network: arc-testnet
    source:
      # deployed 2026-09-10 (Arc testnet, tx 0x080aba99…157e9)
      # once Task 2 lands (POLICY_WALLET_ADDR in .env). Structure is
      # address-parameterized so only this line changes at deploy time.
      address: "0x4e83eB15EE973A49E40D9A79aB2cA89a4Eb4894E"
      abi: PolicyWallet
      # Deployment block (tx 0x080aba99c171aea562a26e7dc59f9c8bd9b5c921723ba17c29d9485e51c157e9),
      # verified via cast receipt. No events can predate construction.
      startBlock: 61330579
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CostPaid
        - PolicyBlocked
        - PolicyConfig
        - DailyPnL
      abis:
        - name: PolicyWallet
          file: ./abis/PolicyWallet.json
      eventHandlers:
        - event: WithdrawalExecuted(indexed address,uint256)
          handler: handleCostPaid
        - event: PolicyBlocked(string)
          handler: handlePolicyBlocked
        - event: PolicySet(uint256,uint256)
          handler: handlePolicySet
      file: ./src/mapping.ts
