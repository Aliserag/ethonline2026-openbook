# OpenBook P&L subgraph — schema (Task 4).
#
# Semantic entities model the freshness-ledger economics on Arc testnet:
#   revenue  <- QueryPaid  (client pays for a query; JobFunded)
#   revenue  <- Settled    (payment released to provider; PaymentReleased)
#   refunds  <- RefundIssued (Refunded)
#   costs    <- CostPaid   (PolicyWallet WithdrawalExecuted)
# blocked intents are surfaced via PolicyBlocked (no P&L impact).
# DailyPnL is the day-bucketed (block.number / 21600) running aggregate.
#
# NOTE: raw USDC Transfer events are NEVER indexed (EIP-7708 double-count trap);
# Dollar figures are carried in the semantic events above.

# NOTE: QueryPaid is created at JobCreated (provider/expiredAt only exist there)
# and funded at JobFunded (amount) — so it is NOT immutable; id is the stable
# jobId. Revenue is booked ONLY at PaymentReleased (Seller payouts); JobFunded
# is a buyer->escrow commitment, never a P&L revenue line.

type QueryPaid @entity(immutable: false) {
  id: Bytes!
  jobId: BigInt!
  buyer: Bytes!
  seller: Bytes!
  amount: BigInt!
  """The SLA floor on the dataset chain once the hook's Attested event lands; the Arc creation block until then."""
  minBlock: BigInt!
  deadline: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  """The delivered block on the dataset chain, from the hook's Attested event (null until attested)."""
  deliveredBlock: BigInt
  """The Fulfilled row for this job (set at JobSubmitted) so the attestation can update it."""
  fulfilledId: Bytes
}

type Fulfilled @entity(immutable: true) {
  id: Bytes!
  jobId: BigInt!
  payloadHash: Bytes!
  metaBlock: BigInt!
}

type Settled @entity(immutable: true) {
  id: Bytes!
  jobId: BigInt!
  seller: Bytes!
  amount: BigInt!
}

type RefundIssued @entity(immutable: true) {
  id: Bytes!
  jobId: BigInt!
  reason: String!
}

type CostPaid @entity(immutable: true) {
  id: Bytes!
  to: Bytes!
  amount: BigInt!
}

type PolicyBlocked @entity(immutable: true) {
  id: Bytes!
  reason: String!
}

# Latest PolicyWallet caps (perTxCap / dailyCap) — feeds Task 7 admin "current
# caps" story. Singleton row: `current`. PolicySet fires on every cap change.
type PolicyConfig @entity(immutable: false) {
  id: ID!
  perTxCap: BigInt!
  dailyCap: BigInt!
}

type DailyPnL @entity(immutable: false) {
  id: ID!
  """Unix timestamp of the first event in this block bucket — the UI renders it as the day label."""
  startedAt: BigInt!
  revenue: BigInt!
  costs: BigInt!
  refunds: BigInt!
  net: BigInt!
}

# ---- W4 market aggregates (marketplace plan, spec §3) ----
# GLOBAL per-provider commerce stats over every escrow this subgraph indexes
# (the shared ERC-8183 reference contract AND the OpenBook escrow instance).
# "Provider" = any seller address that created a job (provider of record in
# JobCreated) on an indexed escrow — not just the OpenBook operator. Day
# buckets reuse the DailyPnL convention: block.number / 21600 ≈ one day.

type Provider @entity(immutable: false) {
  id: Bytes!                  # provider address (provider of record in JobCreated)
  jobs: Int!                  # JobCreated count for this provider
  settled: BigInt!            # total PaymentReleased volume
  refunded: BigInt!           # total Refunded volume attributable to this provider's jobs
  delivered: Int!             # JobSubmitted (fulfillment) count
  avgLagBlocks: BigDecimal!   # running mean of (fulfillment block - job creation block)
  lastJobAt: BigInt!          # block timestamp of the provider's most recent JobCreated
  _lastActiveDay: String      # internal: last day bucket counted into MarketDay.providers (dedupe)
  _lagSamples: Int!           # internal: deliveries that contributed a lag sample (mean denominator)
}

type MarketDay @entity(immutable: false) {
  id: ID!                     # "day-" + block.number / 21600 (same bucket as DailyPnL)
  jobs: Int!                  # JobCreated count that day, every provider
  volume: BigInt!             # PaymentReleased volume that day, every provider
  refunds: BigInt!            # Refunded volume that day, every provider
  providers: Int!             # distinct providers with a job created that day
}

# Internal per-job registry (jobId -> provider + creation block). Required by
# the frozen public interface: Refunded carries no provider and fulfillment lag
# needs the creation block, so every provider's job must be registered at
# JobCreated time to attribute refunds and lag for ALL providers, not only the
# OpenBook seller. Not part of the public market interface (app side maps only
# Provider/MarketDay). Immutable: one JobCreated per job.
type JobMeta @entity(immutable: true) {
  id: Bytes!                  # "jm-" + emitting-conract + "-" + jobId (contract-scoped: two escrows share the uint256 jobId space)
  provider: Bytes!
  createdAt: BigInt!          # JobCreated block = earliest acceptable block for this job
}
